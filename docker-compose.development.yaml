x-default-environment: &default-environment
  TZ: UTC
  NODE_ENV: development
  DB_HOST: db
  DB_PORT: 1433
  DB_NAME: express_light_rail_development
  DB_USER: sa
  DB_PASS: &database-password DevPwd99!

services:
  app:
    build:
      context: .
      dockerfile: development.Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-express-light-rail}-app"
    init: true
    command: npm run example:dev
    environment:
      <<: *default-environment
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  test_app:
    build:
      context: .
      dockerfile: development.Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-express-light-rail}-app"
    init: true
    command: /bin/true
    environment:
      <<: *default-environment
      NODE_ENV: test
      DB_NAME: express_light_rail_test
      EXAMPLE_LOG_LEVEL: error
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *database-password
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Optional diagram rendering, as in the host applications.
  plantuml:
    image: plantuml/plantuml-server:jetty
    ports:
      - "9999:8080"
    environment:
      PLANTUML_LIMIT_SIZE: 8192

volumes:
  db_data:
  node_modules:
