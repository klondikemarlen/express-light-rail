x-default-environment: &default-environment
  TZ: UTC
  NODE_ENV: development
  DATABASE_HOST: database
  DATABASE_PORT: 5432
  DATABASE_NAME: express_light_rail_development
  DATABASE_USERNAME: &database-username express_light_rail
  DATABASE_PASSWORD: &database-password DevPwd99!
  DATABASE_POOL_MAXIMUM: "${DATABASE_POOL_MAXIMUM:-5}"
  DATABASE_POOL_MINIMUM: "${DATABASE_POOL_MINIMUM:-0}"
  DATABASE_POOL_ACQUIRE_TIMEOUT_MILLISECONDS: "${DATABASE_POOL_ACQUIRE_TIMEOUT_MILLISECONDS:-30000}"
  DATABASE_POOL_IDLE_TIMEOUT_MILLISECONDS: "${DATABASE_POOL_IDLE_TIMEOUT_MILLISECONDS:-10000}"
  EXAMPLE_JWT_SECRET: "${EXAMPLE_JWT_SECRET:-}"

services:
  app:
    build:
      context: .
      dockerfile: development.Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-express-light-rail}-app"
    init: true
    command: npm run example:dev
    environment:
      <<: *default-environment
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  test_app:
    build:
      context: .
      dockerfile: development.Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-express-light-rail}-app"
    init: true
    command: /bin/true
    environment:
      <<: *default-environment
      NODE_ENV: test
      DATABASE_NAME: express_light_rail_test
      EXAMPLE_LOG_LEVEL: error
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: *database-username
      POSTGRES_PASSWORD: *database-password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Optional diagram rendering, as in the host applications.
  plantuml:
    image: plantuml/plantuml-server:jetty
    ports:
      - "9999:8080"
    environment:
      PLANTUML_LIMIT_SIZE: 8192

volumes:
  postgres_data:
  node_modules:
